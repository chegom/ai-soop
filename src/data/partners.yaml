# 파트너 제품 소개 카드
# 회사와 제품 설명만 적습니다.
# 담당자 메일, 전화, 개인 SNS, 문의 링크는 넣지 마세요.
# 제품 소개를 올리고 싶다면 사이트 문의(제품 소개)로 받습니다.

- id: sample-partner-leaf
  example: true
  company: 예시 회사 잎새
  product: 리프노트
  summary: 회의가 끝난 뒤 할 일과 남은 질문을 한 장으로 모아 주는 예시 제품입니다.
  points:
    - 대화 메모를 할 일, 보류, 다음 질문으로 나눕니다.
    - 팀이 다음에 다시 열 문장만 남깁니다.

- id: sample-partner-stream
  example: true
  company: 예시 회사 개울
  product: 흐름판
  summary: 반복되는 업무 순서를 보드 위에 올려 어디서 멈추는지 보여주는 예시 제품입니다.
  points:
    - 손작업과 자동으로 넘길 단계를 색으로 구분합니다.
    - 막힌 단계에 확인할 문장을 붙여 둡니다.

- id: sample-partner-acorn
  example: true
  company: 예시 회사 도토리
  product: 도토리캠프
  summary: 짧은 강의 뒤에 참가자가 혼자 복습할 연습 묶음을 만드는 예시 제품입니다.
  points:
    - 강의 한 회를 예시, 연습, 막힌 지점으로 나눕니다.
    - 자료 링크 없이 읽어도 순서가 보이게 구성합니다.
