# 강사 소개
# 사진, 이름, 강의 주제, 짧은 경력만 적습니다.
# 메일, 전화번호, 개인 SNS, 개인 사이트는 넣지 마세요.
# 강의 요청 버튼도 만들지 않습니다. 연결은 AI 숲 문의로만 합니다.
# photo 는 public/ 기준 경로입니다. 예: images/instructors/a.svg

- id: sample-instructor-a
  example: true
  name: 예시 강사 A
  photo: images/instructors/a.svg
  topics:
    - 업무 자동화
    - 프롬프트 검토
  highlights:
    - 예시 경력. 작은 팀의 반복 업무를 나누는 워크숍을 진행했습니다.
    - 예시 경력. 비개발자와 함께 쓰는 확인 목록을 다룹니다.

- id: sample-instructor-b
  example: true
  name: 예시 강사 B
  photo: images/instructors/b.svg
  topics:
    - 이미지와 글
    - 콘텐츠 실험
  highlights:
    - 예시 경력. 한 아이디어를 여러 형태로 바꾸는 짧은 연습을 진행했습니다.
    - 예시 경력. 결과물의 톤을 맞추는 기준을 함께 적습니다.

- id: sample-instructor-c
  example: true
  name: 예시 강사 C
  photo: images/instructors/c.svg
  topics:
    - 데이터 읽기
    - 강의 자료 구성
  highlights:
    - 예시 경력. 숫자와 사례를 한 장 요약으로 줄이는 시간을 맡았습니다.
    - 예시 경력. 들은 사람이 다음에 혼자 따라 할 순서를 남깁니다.
