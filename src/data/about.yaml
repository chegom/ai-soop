# 모임 소개 문장. 페이지 레이아웃은 그대로 두고 글만 고칩니다.

lead: 개발자, 디자이너, 기획자, 창작자, 마케터처럼 서로 다른 일을 하는 사람들이 AI를 일과 창작에 연결하며 함께 배우고 만드는 모임입니다.

story:
  - 도구 이름을 외우는 데서 멈추지 않습니다. 각자 써 본 방법, 막혔던 지점, 다음에 바꿔 볼 것을 나눕니다.
  - 온라인으로 자주 만나고, 서울 구로와 홍대에서 오프라인으로도 모입니다.
  - 강의와 제휴, 제품 소개, 강사 등록은 모두 AI 숲이 한 곳에서 받습니다. 운영자가 내용을 보고 연결합니다.

people:
  - title: 개발 · 자동화
    text: 에이전트와 코드, 반복 업무를 줄이는 흐름을 직접 만들어 본 이야기를 나눕니다.
  - title: 디자인 · 콘텐츠
    text: 이미지, 영상, 글을 더 또렷하게 만드는 실험을 보여 줍니다.
  - title: 기획 · 마케팅
    text: 리서치와 캠페인, 고객 경험에 AI를 어떻게 붙였는지 이야기합니다.
  - title: 교육 · 비즈니스
    text: 배운 것을 설명하고, 현장의 질문으로 다시 가져옵니다.

practices:
  - title: 일에 써 본 방법
    text: 시간을 아껴 준 프롬프트, 정리 방식, 작은 자동화를 들려 줍니다.
  - title: 작게 만든 결과
    text: 완성된 서비스만이 아니라 아직 다듬는 중인 실험도 환영합니다.
  - title: 다시 해 볼 기록
    text: 잘된 결과와 함께, 왜 막혔는지도 남겨 다음 사람이 이어서 하게 합니다.

locations:
  - name: 서울 구로
    text: 일하는 방법에 대해 차분히 나누는 오프라인 거점입니다.
  - name: 서울 홍대
    text: 창작과 협업이 가볍게 시작되는 오프라인 거점입니다.
  - name: 온라인
    text: 거리와 상관없이 강의와 짧은 모임을 이어 갑니다.
